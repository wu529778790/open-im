# Deploy web/dist to GitHub Pages (Vite build in web/)
#
# One-time repo setup (otherwise deploy may fail):
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Optional: create an Environment named "github-pages" if prompted (first run).
#
# The "github-pages" environment often restricts which branches may deploy (default: main only).
# If you need Pages to update on every `dev` push, go to:
#   Settings → Environments → github-pages → Deployment branches
# and allow `dev` (or all branches). Otherwise only `main` pushes trigger deploy below.

name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/config-web-page-i18n.ts"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # Intentionally omit actions/configure-pages: it calls the Pages API and returns 404
      # until the site exists. For static assets, upload + deploy is enough.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
